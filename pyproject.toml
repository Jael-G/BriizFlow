[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "briizflow"
# Version lives in app/__init__.py (`__version__`) — see [tool.setuptools.dynamic].
dynamic = ["version"]
description = "BriizFlow — voice-to-text dictation for Linux (local whisper.cpp or online OpenAI)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Jael Gonzalez" },
]
keywords = [
    "dictation",
    "speech-to-text",
    "whisper",
    "whisper.cpp",
    "voice",
    "offline",
    "linux",
    "pyside6",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "PySide6>=6.6",
    "sounddevice>=0.4.6",
    # sounddevice's InputStream/OutputStream hand the callback numpy arrays but
    # do NOT declare numpy as a dependency (they only require cffi), so we must
    # pin it ourselves or a fresh install fails at record time.
    "numpy>=1.24",
    # Decodes the recording chime assets (app/assets/*.wav) to numpy for
    # playback; sounddevice plays raw samples and cannot decode audio files.
    "miniaudio>=1.61",
    "pynput>=1.7.6",
    "python-xlib>=0.33",
    # Optional but recommended for Wayland global hotkeys:
    "dbus-next>=0.2.3",
    # Stores the optional OpenAI API key in the freedesktop Secret Service
    # (system keyring). Imported lazily; the app falls back to an in-memory
    # session store when the service is unavailable.
    "secretstorage>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/JAEL-G/BriizFlow"
Repository = "https://github.com/JAEL-G/BriizFlow"
Issues = "https://github.com/JAEL-G/BriizFlow/issues"

[project.scripts]
briizflow = "app.main:main"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.ui" = ["lucide/*.svg", "lucide/LICENSE"]
"app.ui.theme" = ["*.qss"]
"app.assets" = ["*.svg", "*.wav"]
